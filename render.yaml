services:
  - type: web
    name: dms-backend
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: "https://dms-frontend.onrender.com"

  - type: web
    name: dms-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "npm run build"
    publishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://dms-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
